# High-Performance Production Nginx Reverse Proxy & Load Balancer
# Configured for Heavy E-Commerce Traffic (Flash sales, Bot mitigation, Zero-downtime deploys)

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # High-Throughput I/O Optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    types_hash_max_size 2048;
    server_tokens off;

    # Compression (Gzip)
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Rate Limiting Zones (DDoS, Scraping, and Carding Prevention)
    # 1. General browsing rate limit: 60 requests/sec per IP, burst up to 120
    limit_req_zone $binary_remote_addr zone=general_zone:10m rate=60r/s;
    # 2. Sensitive checkout & payment rate limit: 5 requests/sec per IP, burst up to 10
    limit_req_zone $binary_remote_addr zone=checkout_zone:10m rate=5r/s;
    # 3. Authentication rate limit: 3 requests/sec per IP, burst up to 5
    limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=3r/s;

    # Connection limit per IP to prevent socket starvation
    limit_conn_zone $binary_remote_addr zone=conn_limit_per_ip:10m;

    # Load Balancing Upstream Pool (Least Connections Algorithm)
    # Balances traffic across multiple Node.js Next.js cluster instances
    upstream ecom_backend {
        least_conn;
        server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
        server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
        
        # Keepalive persistent connections between Nginx and Node.js
        keepalive 64;
    }

    server {
        listen 80;
        server_name apiary.royalhoney.com localhost;

        # Connection limits
        limit_conn conn_limit_per_ip 50;

        # Standard Proxy Headers
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 1. Load Balancer Liveness & Readiness Probes (Zero Caching, Instant Response)
        location ~ ^/api/(health|ready)$ {
            proxy_pass http://ecom_backend;
            proxy_connect_timeout 2s;
            proxy_read_timeout 3s;
            access_log off;
        }

        # 2. Strict Rate Limiting for Checkout & Order Placement
        location = /api/checkout {
            limit_req zone=checkout_zone burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://ecom_backend;
            proxy_connect_timeout 5s;
            proxy_read_timeout 15s;
        }

        # 3. Anti-Brute-Force Rate Limiting for Authentication
        location = /api/auth/login {
            limit_req zone=auth_zone burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://ecom_backend;
        }

        # 4. Next.js Static Assets & Media (Immutable Edge Caching)
        location /_next/static/ {
            proxy_pass http://ecom_backend;
            proxy_cache_valid 200 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }

        # 5. Public Static Images (24-Hour Cache)
        location ~* \.(jpg|jpeg|png|webp|avif|ico|svg)$ {
            proxy_pass http://ecom_backend;
            add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
            access_log off;
        }

        # 6. Default Dynamic Application Traffic with General Rate Limiting
        location / {
            limit_req zone=general_zone burst=120 delay=60;
            proxy_pass http://ecom_backend;
            proxy_connect_timeout 5s;
            proxy_send_timeout 15s;
            proxy_read_timeout 15s;
            proxy_buffer_size 128k;
            proxy_buffers 4 256k;
            proxy_busy_buffers_size 256k;
        }
    }
}
